# Pipeline local trong src; độc lập với notebooks. Mặc định đọc CSV đã tải.
TICKER: '^GSPC'
SOURCE: csv
CSV_PATH: data/raw/GSPC_2018-01-01_2024-01-01.csv
CSV_PRICE_BASIS: unknown
START: '2018-01-01'
END: '2024-01-01'
KAGGLE_DATASET: ''
KAGGLE_FILE: ''
COLUMN_MAP: {}
DATE_COLUMN: Date
DATE_FORMAT: null
TICKER_COLUMN: null
CSV_SEP: ','
CSV_ENCODING: utf-8
CSV_STRIP_TOKENS: ['$']
CSV_THOUSANDS: ','
CSV_DECIMAL: '.'
DAILY_POLICY: strict
DATASET_NOTE: ''
OUTPUT_ROOT: reports/experiments
DEVICE: cpu
CPU_THREADS: 1
MODELS: [LSTM, LSTM_PSO, ANFIS]
TRAIN_RATIO: 0.70
VAL_RATIO: 0.15
TEST_RATIO: 0.15
LOOKBACK: 60
HORIZON: 1
REQUIRE_GPU: false
SMOKE_TEST: false
SEEDS: [42, 123, 2026]
HIDDEN_DIM: 64
NUM_LAYERS: 2
DROPOUT: 0.2
LEARNING_RATE: 0.001
ANFIS_NUM_RULES: 5
ANFIS_LEARNING_RATE: 0.001
BATCH_SIZE: 64
EPOCHS: 60
PATIENCE: 10
SEARCH_SEED: 2026
PSO_PARTICLES: 6
PSO_ITERATIONS: 5
SEARCH_EPOCHS: 8
SEARCH_PATIENCE: 3
RUN_WAVELET: false  # CLI tự tính lại từ MODELS; chọn wavelet-lstm hoặc wavelet-lstm-pso để bật.
WAVELET: db4
WAVELET_LEVEL: 3
COMMISSION: 0.001
