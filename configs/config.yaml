# Cấu hình chung cho đề tài Hybrid Computational Intelligence for Stock Market Prediction

project:
  name: "Hybrid-Computational-Intelligence-Stock-Prediction"
  version: "1.0.0"
  seed: 42
  device: "cuda" # cuda hoặc cpu

data:
  ticker: "^GSPC" # Hoặc mã CP Việt Nam (ví dụ: "VCB", "FPT") / Quốc tế (ví dụ: "AAPL", "^GSPC")
  source: "yfinance" # yfinance / vnstock / csv
  start_date: "2018-01-01"
  end_date: "2024-01-01"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seq_length: 60 # Lookback window (số phiên giao dịch nhìn về quá khứ)
  prediction_horizon: 1 # Dự đoán t+1
  target_col: "Close"

features:
  use_technical_indicators: true
  indicators:
    - "SMA_20"
    - "EMA_20"
    - "RSI_14"
    - "MACD"
    - "BBANDS"
    - "ATR_14"
  decomposition:
    enabled: true
    method: "wavelet" # wavelet (DWT) hoặc emd (Empirical Mode Decomposition)
    wavelet_name: "db4"
    level: 3

models:
  type: "hybrid" # baseline / neural / fuzzy / hybrid
  neural:
    architecture: "LSTM" # LSTM / BiLSTM / GRU / CNN-LSTM / Transformer
    hidden_dim: 64
    num_layers: 2
    dropout: 0.2
    learning_rate: 0.001
    batch_size: 32
    epochs: 100
    early_stopping_patience: 15
  fuzzy:
    num_membership_funcs: 3
    membership_type: "gaussian"
  optimizer: # Thuật toán tối ưu hóa bầy đàn / tiến hóa (Metaheuristics)
    algorithm: "PSO" # PSO / GA / GWO
    population_size: 30
    max_iter: 50

evaluation:
  metrics:
    - "RMSE"
    - "MAE"
    - "MAPE"
    - "Directional_Accuracy"
    - "R2"
  backtest:
    initial_capital: 100000.0 # Vốn khởi điểm ($ hoặc VND)
    commission_rate: 0.001 # 0.1% phí giao dịch
